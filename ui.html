<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  :root {
    --success: blue;
    --bg: #ffffff;
    --text: #333333;
    --text-muted: #555555;
    --text-subtle: #888888;
    --text-hover: #333333;
    --btn-disabled: #262626;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --text: #e0e0e0;
      --text-muted: #aaaaaa;
      --text-subtle: #777777;
      --text-hover: #cccccc;
      --btn-disabled: #444444;
    }
  }

  html {
    background-color: var(--bg);
  }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    padding: 20px; 
    margin: 0;
    overflow: hidden;
    background-color: var(--bg);
    color: var(--text);
  }
  .container {
    background: var(--bg);
    padding: 20px;
    border-radius: 12px;
  }
  button { 
    width: 100%; 
    padding: 12px; 
    border: none; 
    border-radius: 999px; 
    font-weight: 600; 
    cursor: pointer; 
    transition: opacity 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--success); color: white;
  }
  button:active { transform: scale(0.98); }
  button:disabled { background: var(--btn-disabled); cursor: not-allowed; opacity: 0.6; }

  
  .status {
    font-size: 11px;
    margin-bottom: 8px;
    padding: 8px;
    color: var(--text-muted);
    text-align: center;
  }
  .docs {
    margin-top: 14px;
    text-align: center;
  }
  .docs a {
    font-size: 11px;
    color: var(--text-subtle);
    text-decoration: none;
  }
  .docs a:hover { color: var(--text-hover); }
  .icon { font-size: 16px; }
</style>

<div class="container">
  <div class="section">
    <div class="status" id="zipStatus">Select a frame in Figma to get started</div>
    <button id="zipBtn" disabled>
      <span class="icon"></span> Export .ZIP
    </button>
  </div>

  <div class="docs">
    <a href="https://page-grid.com/docs/figmaimport/" target="_blank">📖 Documentation</a>
  </div>
</div>

<script>
  let cleanJson = null;
  let imageAssets = [];
  let suggestedFileName = "pagegrid_export";

  async function compressJpeg(bytes, quality = 0.82) {
    return new Promise(resolve => {
      const blob = new Blob([bytes], { type: 'image/jpeg' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(b => {
          URL.revokeObjectURL(url);
          b.arrayBuffer().then(ab => resolve(new Uint8Array(ab)));
        }, 'image/jpeg', quality);
      };
      img.src = url;
    });
  }

  // Kommunikation von code.js empfangen
  window.onmessage = async (event) => {
    const msg = event.data.pluginMessage;
    
    if (msg.type === 'waiting') {
      cleanJson = null;
      imageAssets = [];
      document.getElementById('zipStatus').innerText = "Select a frame in Figma to get started";
      document.getElementById('zipBtn').disabled = true;
    }

    if (msg.type === 'data-ready') {
      cleanJson = msg.payload;
      imageAssets = msg.images;
      suggestedFileName = msg.fileName || "export";

      document.getElementById('zipStatus').innerText = imageAssets.length + " image(s) detected.";
      document.getElementById('zipBtn').disabled = false;
    }
  };

  // ZIP Generierung Funktion
  document.getElementById('zipBtn').onclick = async () => {
    if (!imageAssets.length && !cleanJson) return;
    
    document.getElementById('zipStatus').innerText = "⚡ Generating ZIP...";
    const zip = new JSZip();

    // Bilder in den Assets-Ordner packen
    for (const img of imageAssets) {
      if (img.format === 'svg') {
        zip.file(`assets/${img.name}.svg`, img.svgString);
      } else {
        let fileBytes = img.bytes;
        if (img.format === 'jpg' && fileBytes.length > 1048576) {
          fileBytes = await compressJpeg(fileBytes);
        }
        zip.file(`assets/${img.name}.${img.format}`, fileBytes);
      }
    }

    // Das saubere JSON ebenfalls ins ZIP legen (als Backup)
    zip.file("data.json", JSON.stringify(cleanJson, null, 2));

    try {
      const content = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(content);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${suggestedFileName}.zip`;
      link.click();
      
      document.getElementById('zipStatus').innerText = "✅ ZIP downloaded!";
    } catch (err) {
      document.getElementById('zipStatus').innerText = "❌ Error creating ZIP";
      console.error(err);
    }
  };
</script>
